<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMDb Rating Predictor AI</title>
    <!-- Import Font Modern -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --success: #10b981;
            --error: #ef4444;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,1) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,1) 0, transparent 50%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 100%;
            max-width: 500px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 8px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #cbd5e1;
            letter-spacing: 0.5px;
        }

        input {
            width: 100%;
            padding: 14px 16px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            font-size: 15px;
            transition: all 0.3s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
            background: rgba(15, 23, 42, 0.9);
        }

        input::placeholder {
            color: #475569;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        button {
            width: 100%;
            padding: 16px;
            margin-top: 10px;
            background: linear-gradient(135deg, var(--primary), #8b5cf6);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -10px var(--primary);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        /* Spinner Animation */
        .spinner {
            display: none;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s ease-in-out infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .result {
            margin-top: 25px;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            display: none;
            animation: slideUp 0.4s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result.success {
            background: rgba(16, 185, 129, 0.1);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: #34d399;
        }

        .result.error {
            background: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            color: #f87171;
        }

        .rating-score {
            font-size: 36px;
            font-weight: 700;
            display: block;
            margin-top: 5px;
            color: white;
            text-shadow: 0 0 20px rgba(16, 185, 129, 0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>🎬 IMDb Rating Predictor</h1>
        <p>Masukkan detail film untuk melihat estimasi rating</p>
    </div>

    <form id="predictionForm">
        <div class="grid-2">
            <div class="form-group">
                <label>Durasi (Menit)</label>
                <input type="number" id="runtime" value="148" required>
            </div>
            <div class="form-group">
                <label>Tahun Rilis</label>
                <input type="number" id="released_year" value="2010" required>
            </div>
        </div>
        
        <div class="grid-2">
            <div class="form-group">
                <label>Skor Metacritic</label>
                <input type="number" id="meta_score" value="74" required>
            </div>
            <div class="form-group">
                <label>Pendapatan (Gross $)</label>
                <input type="number" id="gross" value="292576195" required>
            </div>
        </div>

        <div class="form-group">
            <label>Genre (Pisahkan dengan koma)</label>
            <input type="text" id="genres" value="Action, Adventure, Sci-Fi" required>
        </div>

        <button type="submit" id="submitBtn">
            <span id="btnText">Prediksi Rating</span>
            <div class="spinner" id="spinner"></div>
        </button>
    </form>

    <div id="resultBox" class="result"></div>
</div>

<script>
    document.getElementById('predictionForm').addEventListener('submit', async function(e) {
        e.preventDefault(); 
        
        const btn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const spinner = document.getElementById('spinner');
        const resultBox = document.getElementById('resultBox');
        
        // Ubah tombol jadi mode loading
        btn.disabled = true;
        btnText.innerText = "Menganalisis...";
        spinner.style.display = 'block';
        resultBox.style.display = 'none';

        const payload = {
            runtime: parseFloat(document.getElementById('runtime').value),
            released_year: parseFloat(document.getElementById('released_year').value),
            meta_score: parseFloat(document.getElementById('meta_score').value),
            gross: parseFloat(document.getElementById('gross').value),
            genres: document.getElementById('genres').value.split(',').map(s => s.trim())
        };

        try {
            const response = await fetch('/predict', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (response.ok) {
                resultBox.className = 'result success';
                resultBox.innerHTML = `
                    Estimasi Rating IMDb
                    <span class="rating-score">⭐ ${data.predicted_imdb_rating}</span>
                `;
            } else {
                resultBox.className = 'result error';
                resultBox.innerText = `Error: ${data.error}`;
            }
        } catch (error) {
            resultBox.className = 'result error';
            resultBox.innerText = "Gagal terhubung ke server API.";
        } finally {
            // Kembalikan tombol ke semula
            resultBox.style.display = 'block';
            btn.disabled = false;
            btnText.innerText = "Prediksi Rating";
            spinner.style.display = 'none';
        }
    });
</script>

</body>
</html>
